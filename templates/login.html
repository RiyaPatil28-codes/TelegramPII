{% extends "base.html" %}

{% block title %}Log In - Telegram PII{% endblock %}

{% block content %}
<div class="telegram-login-container">
    <div class="telegram-login-modal">
        <div class="telegram-login-header">
            <button type="button" class="telegram-close-btn" onclick="window.location.href='{{ url_for('index') }}'">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="telegram-login-title">Log In</h2>
        </div>

        <div class="telegram-login-body">
            <!-- Telegram Login Button -->
            <button class="telegram-oauth-btn" type="button">
                <i class="fab fa-telegram-plane"></i>
                Log in with Telegram
            </button>

            <div class="telegram-divider">
                <span>OR</span>
            </div>

            <!-- Login Form -->
            <form method="POST">
                <div class="telegram-form-group">
                    <input type="email" 
                           class="telegram-input" 
                           id="email" 
                           name="email" 
                           placeholder="Username or Email" 
                           required>
                </div>

                <div class="telegram-form-group">
                    <input type="password" 
                           class="telegram-input" 
                           id="password" 
                           name="password" 
                           placeholder="Password" 
                           required>
                </div>

                <div class="telegram-form-group">
                    <label class="telegram-checkbox">
                        <input type="checkbox" id="remember">
                        <span class="telegram-checkmark"></span>
                        Remember Me
                    </label>
                </div>

                <button type="submit" class="telegram-login-btn">
                    Log In
                </button>
            </form>

            <div class="telegram-login-footer">
                <a href="#" class="telegram-link">Forgot password?</a>
                <br>
                <span class="telegram-signup-text">
                    Don't have an account? <a href="{{ url_for('register') }}" class="telegram-link">Sign Up</a>
                </span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
